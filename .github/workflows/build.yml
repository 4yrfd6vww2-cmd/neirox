name: Build iOS IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
     with:
       node-version: '22'
      - run:
          curl -L -o pakeplus.zip https://github.com/Sjj1024/PakePlus-iOS/archive/refs/heads/main.zip
          unzip pakeplus.zip
          mv PakePlus-iOS-main/* .
          rm -rf PakePlus-iOS-main pakeplus.zip
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: |
          xcodebuild -project PakePlus.xcodeproj -scheme PakePlus -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO ARCHS=arm64 ONLY_ACTIVE_ARCH=NO -derivedDataPath build
          mkdir -p output/Payload
          mv build/Build/Products/Release-iphoneos/PakePlus.app output/Payload/
          cd output && zip -r PakePlus.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PakePlus-IPA
          path: output/PakePlus.ipa
