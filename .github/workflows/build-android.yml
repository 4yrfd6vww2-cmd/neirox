name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: |
          curl -L -o pakeplus.zip https://github.com/Sjj1024/PakePlus-Android/archive/refs/heads/main.zip
          unzip pakeplus.zip
          mv PakePlus-Android-main/* .
          rm -rf PakePlus-Android-main pakeplus.zip
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PakePlus-APK
          path: app/build/outputs/apk/release/app-release.apk
